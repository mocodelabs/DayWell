# DayWell — production stack. Requires a filled-in .env.prod (copy .env.example). See docs/DEPLOYMENT.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Request path: client ──HTTPS──► proxy (Caddy, automatic TLS) ──► web (nginx: SPA + /api proxy) ──► backend (gunicorn)
# DAYWELL_ENV_FILE lets a different env file be used (e.g. a throwaway file for a local verification run).
name: daywell-prod

x-backend: &backend
  build: ./backend
  env_file: ${DAYWELL_ENV_FILE:-.env.prod}
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daywell}
      POSTGRES_USER: ${POSTGRES_USER:-daywell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daywell} -d ${POSTGRES_DB:-daywell}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    <<: *backend
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_affirmations"

  backend:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready/"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 4 --max-tasks-per-child 500
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  beat:
    <<: *backend
    # Exactly ONE beat process may run. Correctness doesn't depend on it (dispatch uses row locks), but two beats double the load.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    healthcheck:
      # Heartbeat is scheduled by beat and executed by a worker, so this proves the whole reminder clock works.
      test: ["CMD", "python", "manage.py", "check_scheduler"]
      interval: 60s
      timeout: 30s
      start_period: 120s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DAYWELL_SITE_ADDRESS: ${DAYWELL_SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddydata:
