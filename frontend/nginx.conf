# Serves the built SPA and proxies the API to Django. TLS terminates in front of this (Caddy in docker-compose.prod.yml).
#
# Two nginx gotchas handled here:
#  * `add_header` in a location REPLACES server-level add_header directives, so the security headers live in
#    security_headers.conf and are included in every location that sets its own headers.
#  * A static `upstream`/proxy_pass host is resolved once at startup; when the backend container is recreated it gets a
#    new IP and nginx would return 502 until restarted. Using Docker's resolver with a variable forces re-resolution.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 4m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    include /etc/nginx/snippets/security_headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location ~ ^/(api|health|django-admin|static)/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # The service worker and manifest must never be cached long, or updates won't reach installed apps.
    location = /sw.js {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
