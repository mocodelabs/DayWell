# DayWell — local development stack.
#
#   docker compose up -d db redis          # just the data services (run Django/Vite from your shell)
#   docker compose --profile app up -d     # everything: backend, worker, beat, frontend
#
# Ports are deliberately non-default so DayWell can run next to other local projects.
name: daywell

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DATABASE_URL: postgres://daywell:daywell@db:5432/daywell
  REDIS_URL: redis://redis:6379/0
  DJANGO_SECRET_KEY: dev-only-not-secret
  CELERY_TASK_ALWAYS_EAGER: "false"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: daywell
      POSTGRES_USER: daywell
      POSTGRES_PASSWORD: daywell
    ports: ["127.0.0.1:5440:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daywell -d daywell"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6390:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: [app]
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_affirmations && python manage.py runserver 0.0.0.0:8000"
    environment: *backend-env
    ports: ["127.0.0.1:8020:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    profiles: [app]
    build: ./backend
    command: celery -A config worker -l info --concurrency 2
    environment: *backend-env
    volumes: ["./backend:/app"]
    depends_on:
      backend: { condition: service_healthy }

  beat:
    profiles: [app]
    build: ./backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    environment: *backend-env
    volumes: ["./backend:/app"]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    profiles: [app]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5193"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports: ["127.0.0.1:5193:5193"]
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
